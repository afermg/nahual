name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[appose]' pytest pytest-timeout trio
      - run: python -m pytest -q
      - name: Optional PyZMQ prototype smoke tests
        if: matrix.python == '3.11'
        run: |
          python -m pip install pyzmq
          python -m pytest -q tests/test_transport_benchmark.py tests/test_real_gpu_zmq.py
