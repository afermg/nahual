name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[appose]' pytest pytest-timeout trio
      - run: python -m pytest -q
      - name: Optional PyZMQ prototype smoke tests
        if: matrix.python == '3.11'
        run: |
          python -m pip install pyzmq
          python -m pytest -q tests/test_transport_benchmark.py
